<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conferidor de Seriais</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,.07);
}

h1 {
    margin: 0 0 6px;
}

.sub {
    color: #6b7280;
}

textarea {
    width: 100%;
    min-height: 240px;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font: 14px Consolas, monospace;
    resize: vertical;
}

#resultado {
    width: 100%;
    height: 300px;
    background: #111827;
    color: #e5e7eb;
    border: 0;
    border-radius: 10px;
    padding: 14px;
    font: 14px Consolas, monospace;
    resize: vertical;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-weight: bold;
}

button.green {
    background: #059669;
}

button.secondary {
    background: #4b5563;
}

button.mode {
    background: #e5e7eb;
    color: #111827;
}

button.mode.active {
    background: #2563eb;
    color: white;
}

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.stat {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 15px;
}

.stat b {
    display: block;
    font-size: 25px;
    margin-top: 4px;
}

.label {
    color: #6b7280;
    font-size: 13px;
}

pre {
    background: #111827;
    color: #e5e7eb;
    border-radius: 10px;
    padding: 14px;
    min-height: 55px;
    max-height: 330px;
    overflow: auto;
    white-space: pre-wrap;
}

.warn {
    color: #b45309;
}

.modo {
    margin-top: 15px;
}

.modo-titulo {
    font-weight: bold;
    margin-bottom: 8px;
}

.info {
    margin-top: 10px;
    padding: 10px 12px;
    background: #eff6ff;
    border-radius: 8px;
    color: #1e40af;
    font-size: 13px;
}

@media(max-width:800px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔎 Conferidor de Seriais</h1>

        <p class="sub">
            Escolha o tipo de informação que deseja conferir e cole os dados abaixo.
        </p>

        <div class="modo">

            <div class="modo-titulo">
                Tipo de conferência
            </div>

            <div class="buttons">

                <button
                    id="btnEquipamentos"
                    class="mode active"
                    onclick="selecionarModo('equipamentos')"
                >
                    🔧 Equipamentos
                </button>

                <button
                    id="btnChips"
                    class="mode"
                    onclick="selecionarModo('chips')"
                >
                    📱 Chips
                </button>

            </div>

            <div
                id="infoModo"
                class="info"
            >
                Equipamentos: procura códigos de 12 caracteres.
            </div>

        </div>


        <textarea
            id="entrada"
            placeholder="Cole aqui os dados bagunçados..."
        ></textarea>


        <div class="buttons">

            <button
                class="green"
                onclick="separar()"
            >
                ✨ Separar
            </button>

            <button
                onclick="analisar()"
            >
                🔎 Analisar
            </button>

            <button
                class="secondary"
                onclick="limpar()"
            >
                🧹 Limpar
            </button>

        </div>

    </div>


    <div class="card">

        <div class="stats">

            <div class="stat">
                <span class="label">Total encontrado</span>
                <b id="total">0</b>
            </div>

            <div class="stat">
                <span class="label">Únicos</span>
                <b id="unicos">0</b>
            </div>

            <div class="stat">
                <span class="label">Repetidos</span>
                <b id="repetidos">0</b>
            </div>

            <div class="stat">
                <span class="label">Válidos</span>
                <b id="validos">0</b>
            </div>

            <div class="stat">
                <span class="label">Outros</span>
                <b id="outros">0</b>
            </div>

        </div>

    </div>


    <div class="card">

        <h3 id="tituloResultado">
            ✨ Seriais separados
        </h3>

        <textarea
            id="resultado"
            readonly
            onclick="selecionarResultado()"
        >Nenhum resultado ainda.</textarea>

        <div class="buttons">

            <button
                class="green"
                onclick="copiarSeriais()"
            >
                📋 Copiar
            </button>

            <button
                class="secondary"
                onclick="selecionarResultado()"
            >
                🔲 Selecionar tudo
            </button>

        </div>

    </div>


    <div class="card">

        <h3 class="warn">
            ⚠️ Repetidos
        </h3>

        <pre id="listaRepetidos">Nenhum resultado ainda.</pre>

    </div>

</div>


<script>

let modoAtual = "equipamentos";


/* ================================
   ALTERAR MODO
================================ */

function selecionarModo(modo) {

    modoAtual = modo;

    const btnEquipamentos =
        document.getElementById("btnEquipamentos");

    const btnChips =
        document.getElementById("btnChips");

    const info =
        document.getElementById("infoModo");

    const titulo =
        document.getElementById("tituloResultado");


    if (modo === "equipamentos") {

        btnEquipamentos.classList.add("active");
        btnChips.classList.remove("active");

        info.textContent =
            "Equipamentos: procura códigos de 12 caracteres.";

        titulo.textContent =
            "✨ Seriais separados";

    } else {

        btnEquipamentos.classList.remove("active");
        btnChips.classList.add("active");

        info.textContent =
            "Chips: procura números de 20 dígitos começando com 89.";

        titulo.textContent =
            "📱 Chips separados";
    }


    limpar();

}


/* ================================
   ENCONTRAR EQUIPAMENTOS
================================ */

function encontrarSeriais(texto) {

    const encontrados =
        texto
        .toUpperCase()
        .match(/[A-Z0-9]{12}/g);

    return encontrados || [];
}


/* ================================
   ENCONTRAR CHIPS
================================ */

function encontrarChips(texto) {

    /*
        Chip:
        20 dígitos
        começando com 89

        Exemplo:
        89550534560039532219
    */

    const encontrados =
        texto.match(/\b89\d{18}\b/g);

    return encontrados || [];
}


/* ================================
   ENCONTRAR DADOS
================================ */

function encontrarDados(texto) {

    if (modoAtual === "chips") {

        return encontrarChips(texto);

    }

    return encontrarSeriais(texto);
}


/* ================================
   SEPARAR
================================ */

function separar() {

    const texto =
        document.getElementById("entrada").value;

    const encontrados =
        encontrarDados(texto);

    const unicos =
        [...new Set(encontrados)];


    document.getElementById("resultado").value =
        unicos.length > 0
        ? unicos.join("\n")
        : mensagemNenhum();


    atualizarContadores(
        encontrados,
        unicos
    );

    encontrarRepetidos(encontrados);
}


/* ================================
   ANALISAR
================================ */

function analisar() {

    separar();

}


/* ================================
   MENSAGEM
================================ */

function mensagemNenhum() {

    if (modoAtual === "chips") {

        return "Nenhum chip de 20 dígitos começando com 89 encontrado.";

    }

    return "Nenhum serial de 12 caracteres encontrado.";
}


/* ================================
   CONTADORES
================================ */

function atualizarContadores(
    dados,
    unicos
) {

    const contagem = {};


    dados.forEach(item => {

        if (!contagem[item]) {

            contagem[item] = 0;

        }

        contagem[item]++;

    });


    let quantidadeRepetidos = 0;


    Object.values(contagem).forEach(qtd => {

        if (qtd > 1) {

            quantidadeRepetidos++;

        }

    });


    document.getElementById("total").textContent =
        dados.length;

    document.getElementById("unicos").textContent =
        unicos.length;

    document.getElementById("repetidos").textContent =
        quantidadeRepetidos;

    document.getElementById("validos").textContent =
        dados.length;

    document.getElementById("outros").textContent =
        0;
}


/* ================================
   REPETIDOS
================================ */

function encontrarRepetidos(dados) {

    const contagem = {};


    dados.forEach(item => {

        if (!contagem[item]) {

            contagem[item] = 0;

        }

        contagem[item]++;

    });


    const repetidos = [];


    Object.keys(contagem).forEach(item => {

        if (contagem[item] > 1) {

            repetidos.push(
                item +
                " → apareceu " +
                contagem[item] +
                "x"
            );

        }

    });


    document.getElementById("listaRepetidos").textContent =
        repetidos.length > 0
        ? repetidos.join("\n")
        : "Nenhum item repetido.";
}


/* ================================
   SELECIONAR RESULTADO
================================ */

function selecionarResultado() {

    const campo =
        document.getElementById("resultado");

    campo.focus();

    campo.select();

    campo.setSelectionRange(
        0,
        campo.value.length
    );
}


/* ================================
   COPIAR
================================ */

function copiarSeriais() {

    const campo =
        document.getElementById("resultado");


    if (
        !campo.value ||
        campo.value ===
        "Nenhum resultado ainda."
    ) {

        return;
    }


    selecionarResultado();


    try {

        const sucesso =
            document.execCommand("copy");


        if (sucesso) {

            alert("✅ Copiado!");

        } else {

            alert(
                "Os dados foram selecionados. Pressione Ctrl+C."
            );

        }

    } catch (erro) {

        alert(
            "Os dados foram selecionados. Pressione Ctrl+C."
        );

    }

}


/* ================================
   LIMPAR
================================ */

function limpar() {

    document.getElementById("entrada").value =
        "";

    document.getElementById("resultado").value =
        "Nenhum resultado ainda.";

    document.getElementById("listaRepetidos").textContent =
        "Nenhum resultado ainda.";

    document.getElementById("total").textContent =
        "0";

    document.getElementById("unicos").textContent =
        "0";

    document.getElementById("repetidos").textContent =
        "0";

    document.getElementById("validos").textContent =
        "0";

    document.getElementById("outros").textContent =
        "0";
}

</script>

</body>
</html>
